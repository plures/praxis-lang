name: release

# Release path for praxis-lang.
#
# The .px schema "auto-updates with every release" (ADR §M4, C-DRIFT-001) via a
# STRUCTURAL guarantee, not a manual step: on every release tag we regenerate
# the generated artifacts (schema/px.schema.json, schema/px.schema.px, and
# grammar.pest) from px-ast and FAIL the release if the committed artifacts drift
# from the freshly generated output. A release therefore cannot ship a schema
# that lags the AST — the gate blocks it.
#
# STATUS (post-epic, v0.1.0): crate versions are 0.1.0 and M5 (NAPI bindings)
# has landed, so the M4-era "defer publish to M5" placeholder is stale. The
# `publish` job below executes a real `cargo publish --dry-run` for the
# dependency root plus `cargo package --workspace` (which packages and builds
# every publishable workspace manifest against Cargo's temporary registry; this
# is necessary because dependent crates cannot individually publish-dry-run
# until their unpublished internal dependencies exist on crates.io). It also
# executes `npm publish --dry-run` for the NAPI package. No registry secrets
# currently exist (`CARGO_REGISTRY_TOKEN`,
# `NPM_TOKEN`), so this job deliberately runs the dry-run path ONLY and says
# so explicitly in its job name/output. To enable a future real registry
# release, first add the secrets:
#   gh secret set CARGO_REGISTRY_TOKEN --repo plures/praxis-lang
#   gh secret set NPM_TOKEN --repo plures/praxis-lang
# Then replace the explicitly marked `--dry-run` commands below with real
# `cargo publish` / `npm publish --access public` commands in a reviewed PR.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # REAL, ENFORCED: regenerate every generated artifact from px-ast and block
  # the release if the committed copy drifts. This is the mechanism behind
  # "schema that auto-updates with every release".
  regenerate-artifacts:
    name: regenerate generated artifacts (schema + grammar) from px-ast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Regenerate schema from px-ast (drift gate)
        run: |
          gen="$(mktemp -d)"
          cargo run -q -p px-schema -- "$gen"
          fail=0
          for f in px.schema.json px.schema.px; do
            if ! diff -u "schema/$f" "$gen/$f"; then
              echo "::error::RELEASE BLOCKED: schema/$f is stale. Run scripts/regen-schema.ps1 and commit before tagging a release."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "schema artifacts are a current projection of px-ast."

      - name: Regenerate grammar from px-ast (drift gate)
        run: |
          cargo run -q -p px-grammar-gen > /tmp/px.grammar.gen.pest
          if ! diff -u crates/px-grammar/src/grammar.pest /tmp/px.grammar.gen.pest; then
            echo "::error::RELEASE BLOCKED: grammar.pest is stale. Run scripts/regen-grammar.ps1 and commit before tagging a release."
            exit 1
          fi
          echo "grammar.pest is a current projection of px-ast."

  # Full workspace validation must also pass before any release proceeds.
  verify:
    name: verify (fmt + clippy + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  # REAL PUBLISH JOB (v0.1.0). Runs `cargo publish --dry-run` for every Rust
  # crate in dependency order and `npm publish --dry-run` for the NAPI
  # package. This is genuinely executed, not simulated: cargo/npm perform full
  # manifest + package validation even in dry-run mode, and their output is
  # inspectable in the job log. Real (non-dry-run) publish is gated on the
  # CARGO_REGISTRY_TOKEN / NPM_TOKEN repo secrets existing; the job reports
  # which mode it ran in via its own log output (never silently claims a real
  # publish that didn't happen).
  publish:
    name: publish (dry-run — no registry token configured)
    needs: [regenerate-artifacts, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Confirm generated artifacts are committed (release prerequisite)
        run: |
          test -f schema/px.schema.json
          test -f schema/px.schema.px
          test -f crates/px-grammar/src/grammar.pest
          echo "Generated artifacts present and drift-gated."

      - name: cargo publish --dry-run + package all workspace crates
        run: |
          set -euo pipefail
          echo "Dry-run only: no CARGO_REGISTRY_TOKEN repo secret is configured."
          echo "To enable real crates.io publishing, add the token then replace"
          echo "the --dry-run invocation below in a reviewed release PR."
          # Prove a real publish transaction for the dependency root.
          cargo publish --dry-run --allow-dirty -p px-ast
          # Cargo cannot dry-run each dependent crate individually until px-ast
          # itself is on crates.io. This command creates a temporary registry,
          # packages EVERY workspace crate, rewrites path dependencies to their
          # 0.1.0 registry requirements, and builds the extracted packages in
          # dependency order. It is the full offline-equivalent validation of
          # the first coordinated crates.io release.
          cargo package --workspace --allow-dirty

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Build px-napi native addon (release, host platform)
        working-directory: crates/px-napi
        run: |
          npm install --no-audit --no-fund
          npx napi build --platform --release

      - name: npm publish --dry-run (@plures/px-napi)
        working-directory: crates/px-napi
        run: |
          set -euo pipefail
          echo "Dry-run only: no NPM_TOKEN repo secret is configured."
          echo "To enable real npm publishing, add the token then replace this"
          echo "--dry-run invocation in a reviewed release PR."
          npm publish --dry-run --access public

      - name: Summary
        run: |
          echo "### Publish summary (v0.1.0)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rust crates: cargo publish --dry-run executed for dependency root px-ast; cargo package --workspace then packaged and built every crate against Cargo's temporary registry. Real crates.io publish pending CARGO_REGISTRY_TOKEN secret." >> "$GITHUB_STEP_SUMMARY"
          echo "- px-napi native addon: built for release + npm publish --dry-run executed; real npm publish pending NPM_TOKEN secret." >> "$GITHUB_STEP_SUMMARY"
          echo "- Add secrets with: gh secret set CARGO_REGISTRY_TOKEN --repo plures/praxis-lang ; gh secret set NPM_TOKEN --repo plures/praxis-lang" >> "$GITHUB_STEP_SUMMARY"
